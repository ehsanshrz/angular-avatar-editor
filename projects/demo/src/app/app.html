<p-toast></p-toast>

<div class="avatar-editor-demo">
  <h1>Angular Avatar Editor</h1>
  <p class="subtitle">Powered by <strong>Angular 22</strong> &amp; <strong>Optimus UI</strong></p>

  <div class="editor-wrapper">
    <lib-avatar-editor
      #editor
      [image]="image"
      [width]="width"
      [height]="height"
      [border]="border"
      [scale]="scale"
      [rotate]="rotate"
      [borderRadius]="borderRadius"
      [showGrid]="showGrid"
      [enableWheelZoom]="true"
      [color]="[0, 0, 0, 0.6]"
      (loadSuccess)="onLoadSuccess()"
      (loadFailure)="onLoadFailure()"
      (requestScaleChange)="onScaleChange($event)"
    ></lib-avatar-editor>
  </div>

  <!-- File upload -->
  <div class="control-row">
    <label class="file-label" for="fileInput">
      <p-button icon="pi pi-upload" label="Choose Image" severity="secondary"></p-button>
    </label>
    <input id="fileInput" type="file" accept="image/*" (change)="onFileChange($event)" class="file-input" />
  </div>

  <!-- Zoom slider -->
  <div class="control-group">
    <label>Zoom: {{ scale | number:'1.1-2' }}&times;</label>
    <p-slider
      [(ngModel)]="scale"
      [min]="0.1"
      [max]="4"
      [step]="0.05"
      styleClass="w-full"
    ></p-slider>
  </div>

  <!-- Rotate buttons -->
  <div class="control-row">
    <p-button icon="pi pi-undo" label="Rotate Left" severity="secondary" (onClick)="onRotateLeft()"></p-button>
    <p-button icon="pi pi-refresh" label="Rotate Right" severity="secondary" (onClick)="onRotateRight()"></p-button>
    <p-button
      [label]="showGrid ? 'Hide Grid' : 'Show Grid'"
      icon="pi pi-th-large"
      severity="secondary"
      (onClick)="onToggleGrid()"
    ></p-button>
    <p-button
      [label]="borderRadius > 0 ? 'Square Crop' : 'Circle Crop'"
      icon="pi pi-circle"
      severity="secondary"
      (onClick)="onToggleCircle()"
    ></p-button>
  </div>

  <!-- Save -->
  <div class="control-row">
    <p-button icon="pi pi-download" label="Save Avatar" (onClick)="onSave()"></p-button>
  </div>
</div>
